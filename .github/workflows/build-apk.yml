name: Build Pikachu Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
    - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/pikachu/ai
          cp index.html app/src/main/assets/index.html
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name='Pikachu'; include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.6.1' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.pikachu.ai'; compileSdk 35
            defaultConfig { applicationId 'com.pikachu.ai'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Pikachu" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/pikachu/ai/MainActivity.java <<'EOF'
          package com.pikachu.ai;
          import android.app.*; import android.os.*; import android.webkit.*;
          public class MainActivity extends Activity {
            WebView web;
            public void onCreate(Bundle b){super.onCreate(b); web=new WebView(this); web.getSettings().setJavaScriptEnabled(true); web.getSettings().setDomStorageEnabled(true); web.setWebChromeClient(new WebChromeClient(){public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));}}); setContentView(web); web.loadUrl("file:///android_asset/index.html"); }
            public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pikachu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
